<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>蓝盾 BlueGuard · 终端防护引擎</title>
<link rel="icon" type="image/png" href="/static/icon.png" />
<link rel="apple-touch-icon" href="/static/icon.png" />
<meta name="theme-color" content="#16377d" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'nonce-bg2026'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<style>
:root{
  --bg:#eef2f7; --bg-grad:linear-gradient(160deg,#edf1f7 0%,#e7edf5 100%);
  --panel:#ffffff; --panel-2:#f8fafc; --line:#e5eaf1; --line-2:#eef2f7;
  --text:#0f172a; --text-2:#475569; --muted:#8b95a7;
  --primary:#2f6bff; --primary-d:#1e51d6; --primary-g:linear-gradient(135deg,#3b7bff,#2f6bff 55%,#4a5cff);
  --ok:#16a085; --warn:#e6a23c; --danger:#e5484d; --crit:#d22f3a;
  --radius:13px; --radius-s:9px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 2px 6px rgba(15,23,42,.05);
  --shadow-md:0 4px 10px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);
  --shadow-lg:0 12px 32px rgba(15,23,42,.14),0 30px 60px rgba(15,23,42,.16);
  --side-bg:linear-gradient(180deg,#101c3c 0%,#0e2a63 60%,#16377d 100%);
  --side-line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg-grad);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.95}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px;transition:all .15s ease}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);
  border-radius:var(--radius-s);background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(47,107,255,.13)}
input::placeholder,textarea::placeholder{color:#b3bcc9}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;line-height:18px;font-weight:600;letter-spacing:.2px}
.b-ok{background:#e3f6ef;color:#0e7a5f;border:1px solid #c2ecdd}
.b-warn{background:#fdf3e0;color:#b07616;border:1px solid #f6e0b8}
.b-danger{background:#fdeaea;color:#c23b40;border:1px solid #f6cdcd}
.b-info{background:#e8f0ff;color:#2456c9;border:1px solid #ceddff}
.b-gray{background:#f1f3f7;color:#55617a;border:1px solid #e3e7ef}
.b-crit{background:linear-gradient(135deg,#e5484d,#d22f3a);color:#fff;border:none}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c3ccda;border-radius:20px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab5c8;border:2px solid transparent;background-clip:content-box}

/* 启动遮罩（打开即进入，免登录） */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 20% 10%,#16337c 0%,#0e2a63 45%,#0b1c42 100%);
  overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
#splash::before{content:"";position:absolute;width:560px;height:560px;left:-140px;top:-150px;
  background:radial-gradient(circle,rgba(59,123,255,.34),transparent 65%);filter:blur(10px)}
#splash::after{content:"";position:absolute;width:460px;height:460px;right:-120px;bottom:-140px;
  background:radial-gradient(circle,rgba(64,92,255,.26),transparent 65%);filter:blur(10px)}
#splash.gone{opacity:0;visibility:hidden}
.splash-inner{position:relative;text-align:center;z-index:2}
.splash-mark{font-size:56px;line-height:1;animation:breathe 2.4s ease-in-out infinite;
  filter:drop-shadow(0 10px 28px rgba(80,140,255,.5))}
.splash-name{font-size:25px;font-weight:800;letter-spacing:2.4px;color:#fff;margin-top:14px}
.splash-sub{font-size:12px;color:#9db4e0;letter-spacing:3.2px;margin-top:9px}
.splash-bar{width:196px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);
  margin:26px auto 0;overflow:hidden}
.splash-bar i{display:block;height:100%;width:42%;border-radius:3px;
  background:linear-gradient(90deg,#4a8cff,#9cc0ff);animation:slideBar 1.15s ease-in-out infinite}
.splash-tip{font-size:12px;color:#8ea2cf;margin-top:14px;letter-spacing:.4px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes slideBar{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}

/* 登录（仅 password 模式兜底，默认不出现） */
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;
  background:radial-gradient(1200px 700px at 20% 10%,#16337c 0%,#0e2a63 45%,#0b1c42 100%);overflow:hidden}
#login.show{display:flex}
#login::before{content:"";position:absolute;width:520px;height:520px;left:-120px;top:-120px;
  background:radial-gradient(circle,rgba(59,123,255,.35),transparent 65%);filter:blur(8px)}
#login::after{content:"";position:absolute;width:420px;height:420px;right:-100px;bottom:-120px;
  background:radial-gradient(circle,rgba(64,92,255,.28),transparent 65%);filter:blur(8px)}
.login-card{position:relative;background:rgba(255,255,255,.98);padding:38px 34px;border-radius:18px;
  width:372px;box-shadow:0 24px 70px rgba(0,0,0,.4);backdrop-filter:blur(4px);
  animation:cardIn .4s cubic-bezier(.2,.8,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.login-card h1{font-size:23px;margin-bottom:10px;letter-spacing:.3px;
  background:linear-gradient(135deg,#2456c9,#4a5cff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.login-card p{color:var(--text-2);font-size:13px;margin-bottom:24px}
.login-card input{width:100%;margin-bottom:22px;padding:11px 13px;border-radius:10px;background:#f6f8fc}
.login-card input:focus{background:#fff}
.login-card button{width:100%;padding:14px;background:var(--primary-g);color:#fff;border-radius:10px;line-height:1.8;
  font-weight:700;letter-spacing:2px;font-size:15px;box-shadow:0 6px 16px rgba(47,107,255,.35)}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(47,107,255,.45)}
.login-card button:active{transform:translateY(0)}
.login-err{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:18px}

/* 布局 */
#app{display:none;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:216px;background:var(--side-bg);color:#c9d4ec;
  padding:18px 0;overflow-y:auto;border-right:1px solid var(--side-line);z-index:30;
  box-shadow:2px 0 18px rgba(13,27,62,.18)}
.brand{padding:4px 20px 18px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid var(--side-line);margin-bottom:12px;letter-spacing:.4px}
.brand small{display:block;font-size:11px;color:#8ea2cf;font-weight:400;margin-top:3px;letter-spacing:.3px}
.nav-item{padding:11px 20px;display:flex;align-items:center;gap:11px;font-size:13.5px;cursor:pointer;
  border-left:3px solid transparent;color:#c9d4ec;position:relative;transition:all .16s ease}
.nav-item::before{content:"";position:absolute;right:12px;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.18)}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(64,132,255,.28),rgba(64,132,255,.04));color:#fff;
  border-left-color:#6aa2ff;font-weight:600}
.nav-item.active::before{background:#6aa2ff;box-shadow:0 0 6px #6aa2ff}
.nav-item .ic{width:20px;text-align:center;opacity:.92;font-size:15px}
.main{margin-left:216px;padding:0 0 48px}
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.topbar h2{font-size:18px;font-weight:700;color:var(--text)}
.topbar h2::before{content:"";display:inline-block;width:4px;height:18px;border-radius:2px;
  background:var(--primary-g);margin-right:10px;vertical-align:-3px}
.topbar .right{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--text-2)}
.content{padding:26px 30px}
.page{display:none}.page.active{display:block;animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 卡片/表格 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-bottom:24px}
.card{background:var(--panel);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  border:1px solid var(--line-2);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;line-height:1.8}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.card::after{content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,107,255,.08),transparent 70%)}
.card .k{font-size:13px;color:var(--text-2);margin-bottom:12px;font-weight:500;line-height:1.8}
.card .v{font-size:27px;font-weight:800;line-height:1.1;letter-spacing:.5px}
.card .v.danger{color:var(--crit)}.card .v.warn{color:#d99020}.card .v.ok{color:#14a07f}
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:1px solid var(--line-2);overflow:hidden;margin-bottom:20px}
.panel-h{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,#fbfcfe,#f7f9fc);gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h h3::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--primary-g)}
.panel-b{padding:0}
.panel-b.padded{padding:22px 24px;line-height:2}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{text-align:left;padding:20px 24px;background:linear-gradient(180deg,#f4f7fb,#eef2f8);color:var(--text-2);
  font-weight:600;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px;line-height:1.8}
td{padding:22px 24px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:2.15}
tbody tr:nth-child(even) td{background:#fafbfe}
tbody tr{transition:background .12s ease}
tbody tr:hover td{background:#eef4ff}
tbody tr:last-child td{border-bottom:none}
.log-msg{white-space:pre-wrap;word-break:break-word;line-height:2.1;color:#1e293b;max-width:100%;font-size:14px}
.log-meta{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:10px;font-size:13px;color:var(--muted);line-height:1.9}
.log-row{padding:22px 24px;border-bottom:1px solid var(--line-2);background:#fff}
.log-row:nth-child(even){background:#fafbfe}
.log-row:hover{background:#eef4ff}
.vs-cell{white-space:pre-wrap;word-break:break-word;padding-right:12px;line-height:1.95;overflow:visible}
.vs-msg{white-space:pre-wrap;word-break:break-word;line-height:2.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;max-height:8.2em}
.info-card{margin-bottom:22px;background:linear-gradient(180deg,#fff,#f8fbff);padding:22px 24px;border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.info-card .title{font-weight:700;margin-bottom:12px;font-size:15px;line-height:1.8}
.info-card .body{color:var(--text-2);line-height:2.2;font-size:14px}
.info-card .actions{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.kv{gap:16px 22px;line-height:2.1}
.kv .key{padding:6px 0;color:var(--text-2);font-weight:600}
.kv > div:not(.key){padding:6px 0;white-space:pre-wrap;word-break:break-word}
.empty{padding:60px 28px;text-align:center;color:var(--muted);font-size:14px;line-height:2.2}
.btn{padding:10px 18px;border-radius:var(--radius-s);background:var(--primary-g);color:#fff;font-weight:600;
  box-shadow:0 3px 10px rgba(47,107,255,.28);line-height:1.95}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:7px 14px;font-size:13px;box-shadow:none;line-height:1.95}
.btn.ghost{background:#fff;color:var(--text-2);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:#f6f8fc;color:var(--text)}
.btn.danger{background:linear-gradient(135deg,#e5484d,#d22f3a);box-shadow:0 3px 10px rgba(226,72,77,.28)}
.btn.danger:hover{background:#d22f3a}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.toolbar{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.toolbar input{min-width:200px;background:var(--panel-2)}
.toolbar input:focus{background:#fff}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(13,24,44,.5);display:none;align-items:center;
  justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:540px;max-width:94vw;max-height:88vh;overflow:auto;
  box-shadow:var(--shadow-lg);animation:modalIn .25s cubic-bezier(.2,.85,.3,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:15.5px;
  display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fbfcfe,#f7f9fc)}
.modal-h button{font-size:15px;color:var(--muted);border-radius:6px;width:30px;height:30px;line-height:1}
.modal-h button:hover{background:#eef2f8;color:var(--text)}
.modal-b{padding:22px}
.modal-f{padding:15px 22px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px;background:#fafbfe}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:10px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--panel-2)}
.field input:focus,.field select:focus,.field textarea:focus{background:#fff}
select{appearance:none;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM1NTYtN2FhIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PHBvbHlsaW5lIHBvaW50cz0iNiA5IDEyIDE1IDE4IDkiLz48L3N2Zz4=");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
/* toast */
#toast{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:#1f2937;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;
  box-shadow:0 8px 30px rgba(15,23,42,.3);animation:slide .28s cubic-bezier(.2,.85,.3,1);
  border-left:4px solid #8896ab;min-width:220px;max-width:380px}
.toast.ok{background:linear-gradient(135deg,#17a081,#0e8b6b);border-left-color:#0c785b}
.toast.err{background:linear-gradient(135deg,#e5484d,#cf2e38);border-left-color:#b9262f}
@keyframes slide{from{transform:translateX(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--muted);font-size:12.5px}
.mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:13px}
.kv .key{color:var(--text-2);font-weight:500}
.progress{height:8px;background:#edf0f5;border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#16a085,#21c396);border-radius:6px;transition:width .4s ease}

/* 响应式微调 */
@media (max-width:900px){
  .side{width:64px}
  .side .brand{font-size:0;padding:4px 0 18px;text-align:center}
  .side .brand small{display:none}
  .side .brand::after{content:"🛡";font-size:20px}
  .nav-item{padding:13px 0;justify-content:center;font-size:0;gap:0;white-space:nowrap}
  .nav-item::before{display:none}
  .nav-item .ic{font-size:17px;width:auto}
  .main{margin-left:64px} 
  .content{padding:16px}
  /* 窄屏表格与操作列收窄：缩小内边距/按钮尺寸，操作列按钮自动换行且左对齐不错位 */
  table{font-size:13px}
  th{padding:11px 12px;font-size:12.5px;line-height:1.6}
  td{padding:12px 12px;line-height:1.8}
  .btn{padding:8px 13px;font-size:13px;line-height:1.7}
  .btn.sm{padding:6px 10px;font-size:12px;line-height:1.7}
  td .btn{margin:3px 4px 3px 0;vertical-align:middle}
  .log-row{padding:14px 16px}
  .log-msg{font-size:13px;line-height:1.9}
  .kv{grid-template-columns:108px 1fr;gap:8px 10px;font-size:12.5px}
  .toolbar{gap:10px;margin-bottom:16px}
  .info-card .body{font-size:13px;line-height:1.9}
}

/* ================= 视觉增强层 · V3.0 ================= */
body{background:
  radial-gradient(1200px 620px at 6% -10%,rgba(47,107,255,.10),transparent 62%),
  radial-gradient(900px 520px at 100% 0%,rgba(74,92,255,.075),transparent 58%),
  var(--bg-grad);background-attachment:fixed}
.content{max-width:1600px;margin:0 auto}
.topbar{box-shadow:0 1px 0 rgba(15,23,42,.05),0 10px 26px -20px rgba(15,23,42,.55)}
.topbar h2{letter-spacing:.2px}
.side{box-shadow:3px 0 26px rgba(9,20,48,.26)}
.brand{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}
.nav-item{margin-right:10px;border-radius:0 11px 11px 0;transition:all .18s cubic-bezier(.2,.8,.3,1)}
.nav-item.active{box-shadow:inset 0 0 0 1px rgba(106,162,255,.16),0 4px 16px -10px rgba(0,0,0,.85)}
.card{background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);border:1px solid rgba(226,232,240,.95);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,var(--primary),#4a5cff 55%,rgba(74,92,255,0));
  opacity:0;transition:opacity .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(47,107,255,.3);
  box-shadow:0 12px 30px -12px rgba(47,107,255,.34)}
.card:hover::before{opacity:1}
.card .v{font-variant-numeric:tabular-nums}
.panel{border:1px solid rgba(226,232,240,.95);transition:box-shadow .2s}
.panel:hover{box-shadow:var(--shadow-md)}
.panel-h{background:linear-gradient(180deg,#fcfdff,#f4f8fd)}
.info-card{border-left:3px solid rgba(47,107,255,.75)}
.info-card:hover{box-shadow:var(--shadow-md)}
table{border-collapse:separate;border-spacing:0}
thead th{background:#f6f9fd;color:#5a6a86;font-size:12.5px;letter-spacing:.2px;
  white-space:nowrap;border-bottom:1px solid #e6ecf5}
tbody tr{transition:background .14s}
tbody tr:nth-child(even){background:#fbfcfe}
tbody tr:hover{background:#f1f6ff}
tbody td{border-bottom:1px solid #f1f4f9}
.btn{box-shadow:0 2px 8px -3px rgba(47,107,255,.5);letter-spacing:.2px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost,.btn.sm{box-shadow:none}
select,input[type=text],input[type=search]{background:#fbfcfe}
select:hover,input:hover{border-color:#c9d6ea}
.mono{font-family:"JetBrains Mono",Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.badge{white-space:nowrap}
table td{vertical-align:middle}
.g-detail{margin-top:7px;line-height:1.85;font-size:12px;max-width:360px;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td .btn,th .btn{white-space:nowrap}
.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px}
::-webkit-scrollbar-thumb{background:#cbd5e6}

</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <div class="splash-mark">🛡</div>
    <div class="splash-name">蓝盾 BlueGuard</div>
    <div class="splash-sub">主机主动防护引擎</div>
    <div class="splash-bar"><i></i></div>
    <div class="splash-tip" id="splashTip">正在进入…</div>
  </div>
</div>

<div id="login">
  <div class="login-card">
    <h1>蓝盾 BlueGuard</h1>
    <p>终端检测响应 · Workstation 版</p>
    <div class="login-err" id="loginErr"></div>
    <input id="lu" placeholder="用户名" value="admin" autocomplete="username" />
    <input id="lp" type="password" placeholder="口令" autocomplete="current-password" />
    <button type="button" data-act="doLogin">登 录</button>
    <div style="margin-top:14px;font-size:12px;color:#9ca3af;text-align:center" id="loginHint"></div>
  </div>
</div>

<div id="app">
  <aside class="side">
    <div class="brand">🛡 蓝盾 BlueGuard<small>终端防护引擎 V3.2</small></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">总览仪表盘</h2>
      <div class="right">
        <span id="adminTag"></span>
        <span id="who"></span>
        <button class="btn ghost sm" data-act="logout">退出</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-mask" id="mask"><div class="modal">
  <div class="modal-h"><span id="mTitle"></span><button data-act="closeModal">✕</button></div>
  <div class="modal-b" id="mBody"></div>
  <div class="modal-f" id="mFoot"></div>
</div></div>
<div id="toast"></div>

<script nonce="bg2026">
const API = location.origin + '/api';
let ME = null;

const MENU = [
  ['dashboard','总览仪表盘','◎'],['guard','防护中心','⬢'],['network','网络配置','⇄'],['alerts','告警研判','⚑'],
  ['logs','日志检索','☰'],['live','实时监控','⚡'],['trace','IP 溯源','◈'],['assets','资产台账','▤'],
  ['vulns','漏洞台账','⚠'],['baseline','基线核查','☑'],['incident','应急响应','⛨'],
  ['duty','值班任务','◷'],['reports','报表中心','▦'],['audit','审计','🔒'],
  ['notify','通知中心','✉'],['settings','系统管理','⚙'],
];

function toast(msg, type){ const d=document.createElement('div'); d.className='toast '+(type||'');
  d.textContent=msg; document.getElementById('toast').appendChild(d);
  setTimeout(()=>d.remove(), 3200); }

async function api(path, opt={}){
  const headers = {'Content-Type':'application/json'};
  // 认证走 HttpOnly 会话 Cookie（同源 fetch 自动携带），前端不持有明文令牌
  const res = await fetch(API+path, {method:opt.method||'GET', headers,
    body: opt.body?JSON.stringify(opt.body):undefined});
  if(res.status===401){ logout(true); throw new Error('未登录'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail||data.message||('HTTP '+res.status));
  return data;
}

async function doLogin(){
  const u=document.getElementById('lu').value, p=document.getElementById('lp').value;
  document.getElementById('loginErr').textContent='';
  try{
    const r = await api('/auth/login',{method:'POST',body:{username:u,password:p}});
    // 令牌由服务端写入 HttpOnly Cookie，前端不落 localStorage、不持有明文
    ME=r.user;
    if(r.user.must_change_password){
      toast('首次登录，请先修改初始口令','err');
    }
    boot();
  }catch(e){ document.getElementById('loginErr').textContent = e.message; }
}
window.doLogin = doLogin;
// 直接绑定登录按钮点击（避免事件委托时序问题）
setTimeout(function(){
  var btn = document.querySelector('[data-act="doLogin"]');
  if(btn){
    btn.onclick = function(e){ if(e) e.preventDefault(); doLogin(); return false; };
  }
}, 0);

function showLogin(){ document.getElementById('login').classList.add('show'); }
function hideLogin(){ document.getElementById('login').classList.remove('show'); }
function hideSplash(){
  const s = document.getElementById('splash');
  if(!s) return;
  s.classList.add('gone');
  setTimeout(function(){ if(s && s.parentNode) s.parentNode.removeChild(s); }, 620);
}
window.showLogin = showLogin; window.hideLogin = hideLogin; window.hideSplash = hideSplash;

function logout(silent){
  if(silent){ document.getElementById('app').style.display='none'; showLogin(); return; }
  location.reload();
}
window.logout = logout;

async function boot(){
  // 免登录模式：/auth/me 不需要任何凭据，直接拿到本机身份
  try{
    ME = await api('/auth/me');
  }catch(e){ hideSplash(); showLogin(); return; }
  const h = await api('/health');
  hideLogin();
  document.getElementById('app').style.display='block';
  document.getElementById('who').textContent = ME.open_access ? '本机管理员'
    : (ME.display_name || ME.username);
  const tags = [h.admin ? '<span class="badge b-ok">管理员权限</span>'
                        : '<span class="badge b-warn">普通权限</span>'];
  if(ME.open_access) tags.push('<span class="badge b-info">免登录</span>');
  document.getElementById('adminTag').innerHTML = tags.join(' ');
  const lo = document.querySelector('[data-act="logout"]');
  if(lo && ME.open_access) lo.textContent = '刷新';
  document.getElementById('nav').innerHTML = MENU.map((m,i)=>
    `<div class="nav-item${i===0?' active':''}" data-p="${m[0]}" data-act="go" data-a1="${m[0]}">
       <span class="ic">${m[2]}</span>${m[1]}</div>`).join('');
  // 双保险：直接绑定导航点击
  document.querySelectorAll('#nav .nav-item').forEach(function(el){
    el.onclick = function(){ var p = el.getAttribute('data-p') || el.getAttribute('data-a1'); if(p && window.go) window.go(p, el); };
  });
  // 记住当前页（#guard?tab=events 或 #guard/events 均可直达）
  let raw = (location.hash || '').replace(/^#/, '');
  try{ raw = decodeURIComponent(raw); }catch(e){}
  const hp = raw.split(/[?\/]/)[0];
  if(hp === 'guard'){
    const TABS = ['overview','events','rules','policy','whitelist','responses'];
    let cand = '';
    const m = raw.match(/(?:[?\/&])tab=([a-z]+)/);
    if(m) cand = m[1];
    else{
      const parts = raw.split('/');
      if(parts.length > 1) cand = (parts[1] || '').split(/[?&]/)[0];
    }
    if(TABS.indexOf(cand) >= 0) GUARD_TAB = cand;
  }
  go(MENU.some(x => x[0] === hp) ? hp : 'dashboard');
  document.body.setAttribute('data-route', hp + '|' + GUARD_TAB);
  hideSplash();
}
window.boot = boot;
window.addEventListener('hashchange', function(){
  const p = (location.hash || '').replace(/^#/, '');
  if(p && MENU.some(m => m[0] === p) && window.go) window.go(p);
});

let NAV_TOKEN = 0;
function go(page, el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else{ const n=document.querySelector(`.nav-item[data-p="${esc(page)}"]`); if(n) n.classList.add('active'); }
  const item = MENU.find(m=>m[0]===page);
  document.getElementById('pageTitle').textContent = item?item[1]:page;
  try{
    if(history.replaceState){
      let _h = '#' + page;
      if(page === 'guard' && typeof GUARD_TAB === 'string') _h += '?tab=' + GUARD_TAB;
      history.replaceState(null, '', _h);
    }
  }catch(e){}
  const outer = document.getElementById('content');
  const token = ++NAV_TOKEN;
  // 每次渲染挂在自己的私有容器里：晚到的旧页面结果写进已脱离的节点，不会覆盖当前页
  const box = document.createElement('div');
  box.innerHTML = '<div class="empty">加载中…</div>';
  outer.innerHTML = '';
  outer.appendChild(box);
  const fn = PAGES[page];
  if(!fn){ box.innerHTML = '<div class="empty">该模块待接入</div>'; return; }
  Promise.resolve(fn(box)).catch(e=>{
    if(token === NAV_TOKEN) box.innerHTML = '<div class="empty">加载失败：' + esc(String((e && e.message) || e)) + '</div>';
  });
}
window.go = go;

// ========== 页面实现 ==========
const PAGES = {};

// ========== 体检结论卡（给不懂安全的人看的第一屏）==========
function assessCard(a, opt){
  if(!a) return '';
  opt = opt || {};
  const tone = a.level === 'risk' ? '#c0392b' : a.level === 'attention' ? '#e07b39' : '#2e9e5b';
  const cls  = a.level === 'risk' ? 'b-danger' : a.level === 'attention' ? 'b-warn' : 'b-ok';
  const icon = a.level === 'risk' ? '⚠' : a.level === 'attention' ? '◔' : '✔';
  const rows = (a.items || []).map(function(it, i){
    return '<div style="padding:13px 0;border-top:1px solid #eef2f8">'
      + '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'
      + '<b style="font-size:14px">' + (i + 1) + '. ' + esc(it.name) + '</b>'
      + sevBadge(it.severity)
      + (it.count > 1 ? '<span class="badge b-gray">出现 ' + it.count + ' 次</span>' : '')
      + '</div>'
      + '<div style="margin-top:7px;line-height:1.95;font-size:13.5px;color:#39465a">' + esc(it.what) + '</div>'
      + '<div style="margin-top:5px;line-height:1.95;font-size:13.5px;color:#1f6fd0">'
      + '<b>怎么办：</b>' + esc(it.hint) + '</div></div>';
  }).join('');
  const empty = '<div style="padding:16px 0;color:#6b7a90;line-height:1.95">没查出问题。建议保持当前配置，定期回来点一次「立即扫描」。</div>';
  const more = a.more > 0 ? '<span class="muted" style="margin-left:10px">还有 ' + a.more + ' 条没展开，去事件列表看全部</span>' : '';
  return '<div class="panel" style="border-left:5px solid ' + tone + ';margin-bottom:22px">'
    + '<div class="panel-b" style="padding:24px 26px">'
    + '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
    + '<span style="font-size:20px;color:' + tone + '">' + icon + '</span>'
    + '<span class="badge ' + cls + '" style="font-size:13px;padding:5px 12px">' + esc(a.label) + '</span>'
    + '<b style="font-size:16.5px">' + esc(a.headline) + '</b>'
    + '</div>'
    + '<div class="muted" style="margin-top:9px;line-height:1.9;font-size:13px">'
    + '体检查的是什么：这台机器上正在跑什么程序、连了哪些网、开了哪些端口、开机自启了什么、防护开关有没有关。'
    + '共 <b>' + (a.total || 0) + '</b> 条待处理项。</div>'
    + (rows || (opt.hideEmpty ? '' : empty))
    + '<div class="toolbar" style="margin-top:16px;gap:10px;flex-wrap:wrap">'
    + '<button class="btn sm" data-act="guardRun" data-a1="' + (opt.deep ? '1' : '0') + '">立即扫描一轮</button>'
    + '<button class="btn sm ghost" data-act="go" data-a1="guard">打开防护中心</button>'
    + '<button class="btn sm ghost" data-act="go" data-a1="guard">逐条看事件</button>'
    + more + '</div></div></div>';
}

PAGES.dashboard = async (c)=>{
  const d = await api('/dashboard');
  const card=(k,v,cls,tip)=>`<div class="card" style="padding:24px 26px"><div class="k" style="margin-bottom:12px">${esc(k)}</div><div class="v ${esc(cls||'')}">${esc(v)}</div>${tip?`<div class="muted" style="margin-top:14px;line-height:2.0;font-size:13px">${esc(tip)}</div>`:''}</div>`;
  c.innerHTML = `
  ${assessCard(d.assessment)}
  <div class="info-card"><div class="title">其他模块 · 这是什么、能干什么</div>
    <div class="body">
      <b>防护中心</b>——这台机器安不安全，先看这里。<b>告警研判</b>——引擎发现的可疑行为汇总。<b>日志检索</b>——把 Windows 事件日志拉进来搜。<b>IP 溯源</b>——一个 IP 干过哪些事。<b>资产/漏洞/基线</b>——登记你管的服务器和它们的配置问题。<b>应急响应</b>——出事了开单跟人。<b>报表/审计</b>——给别人看的汇总，以及"谁改了什么"的不可篡改记录。
    </div>
    <div class="actions"><button class="btn sm" data-act="go" data-a1="guard">去防护中心</button><button class="btn sm ghost" data-act="guardRun" data-a1="0">立即扫描一轮</button><button class="btn sm ghost" data-act="go" data-a1="logs">去日志检索</button><button class="btn sm ghost" data-act="go" data-a1="alerts">去告警</button><button class="btn sm ghost" data-act="go" data-a1="trace">去溯源</button><button class="btn sm ghost" data-act="go" data-a1="dashboard">刷新总览</button></div></div>
  <div class="cards" style="gap:14px">
    ${card('资产总数', d.assets, '', '资产与漏洞页管理')}
    ${card('待确认归属', d.authz_unconfirmed, d.authz_unconfirmed?'warn':'', '需确认授权范围')}
    ${card('未闭环漏洞', d.vulns_open, d.vulns_open?'warn':'', '漏洞页可更新状态')}
    ${card('严重漏洞', d.vulns_critical, d.vulns_critical?'danger':'', '优先处置')}
    ${card('待研判告警', d.alerts_pending, d.alerts_pending?'danger':'', '告警页可直接研判')}
    ${card('未闭环事件', d.incidents_open, d.incidents_open?'warn':'', '事件页可推进')}
    ${card('日志总量', d.logs_total, '', '日志检索页可生成演示')}
    ${card('封禁 IP', d.blocked_ips, '', '网络/联动产生')}
    ${card('审计记录', d.audit_rows, '', '审计页查看哈希链')}
  </div>
  <div class="panel"><div class="panel-h"><h3>最近告警</h3><button class="btn sm ghost" data-act="go" data-a1="alerts">打开告警</button></div>
    <div class="panel-b" style="padding:0;overflow:auto">${d.recent_alerts.length?`<table><thead><tr><th style="min-width:180px">规则</th><th>级别</th><th style="min-width:160px">源 IP</th><th>命中</th><th>研判</th></tr></thead><tbody>
      ${d.recent_alerts.map(a=>`<tr><td style="line-height:2.0"><b>${esc(a.rule_name||'')}</b></td><td>${sevBadge(a.severity)}</td>
        <td class="mono">${esc(a.src_ip||'-')}</td><td>${esc(a.hit_count)}</td><td>${triageBadge(a.triage)}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty" style="padding:34px 28px;line-height:2.15">暂无告警。去「日志检索」生成演示日志，再到「告警」运行规则扫描。</div>'}</div></div>
  <div class="panel"><div class="panel-h"><h3>最近事件</h3><button class="btn sm ghost" data-act="go" data-a1="incident">打开事件</button></div>
    <div class="panel-b" style="padding:0;overflow:auto">${d.recent_incidents.length?`<table><thead><tr><th style="min-width:220px">标题</th><th>优先级</th><th>状态</th><th>负责人</th></tr></thead><tbody>
      ${d.recent_incidents.map(i=>`<tr><td style="line-height:2.0">${esc(i.title)}</td><td>${priBadge(i.priority)}</td>
        <td>${esc(i.status)}</td><td>${esc(i.owner||'-')}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty" style="padding:34px 28px;line-height:2.15">暂无事件。可在「告警」对告警执行「转事件」。</div>'}</div></div>`;
};

PAGES.network = async (c)=>{
  const d = await api('/network/ifaces');
  const changes = await api('/network/changes');
  c.innerHTML = `
  <div class="info-card"><div class="title">网络配置 · 直接操作看效果</div>
    <div class="body">① 点 <b>刷新</b> 查看当前网卡；② 点 <b>快照</b> 保存配置；③ 点 <b>改 IP</b> 执行变更（高危，需管理员运行 exe；VMware/虚拟网卡可能被宿主管理程序恢复导致 Level1 失败并回滚）。变更后在「变更记录」点 <b>确认无误</b> 解除看门狗。</div></div>
  ${d.admin ? '' : '<div class="panel" style="border-left:4px solid var(--warn);margin-bottom:22px"><div class="panel-b" style="padding:20px 24px;line-height:1.8"><b>当前非管理员权限</b>：可查看网卡与快照，但改 IP 会返回 ELEVATION_REQUIRED。请右键以管理员身份运行 BlueGuard.exe。</div></div>'}
  <div class="panel"><div class="panel-h"><h3>网络适配器</h3>
    <button class="btn sm ghost" data-act="go" data-a1="network">刷新</button></div>
    <div class="panel-b" style="padding:0;overflow:auto"><table><thead><tr><th style="min-width:220px">名称</th><th>状态</th><th style="min-width:170px">IPv4</th><th style="min-width:140px">网关</th><th>DHCP</th><th style="min-width:170px">操作</th></tr></thead><tbody>
    ${d.ifaces.map(i=>`<tr><td style="line-height:2.0">${esc(i.name)}${i.is_default_route?' <span class="badge b-info">默认路由</span>':''}</td>
      <td>${i.status==='Up'?'<span class="badge b-ok">Up</span>':'<span class="badge b-gray">'+i.status+'</span>'}</td>
      <td class="mono" style="line-height:2.0">${i.ipv4.map(x=>x.ip+'/'+x.prefix).join('<br>')||'-'}</td>
      <td class="mono">${esc(i.gateway||'-')}</td><td>${i.dhcp?'是':'否'}</td>
      <td style="white-space:normal;line-height:2.4;padding-top:10px;padding-bottom:10px"><button class="btn sm ghost" data-name="${esc(i.name)}" data-act="snapFromBtn">快照</button>
          <button class="btn sm" data-iface="${esc(JSON.stringify(i))}" data-act="changeFromBtn">改 IP</button></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="panel"><div class="panel-h"><h3>变更记录（五层兜底）</h3></div>
    <div class="panel-b" style="padding:0;overflow:auto">${changes.length?`<table><thead><tr><th>#</th><th style="min-width:180px">网卡</th><th>状态</th><th style="min-width:170px">看门狗</th><th>操作人</th><th style="min-width:170px">时间</th><th style="min-width:120px">操作</th></tr></thead><tbody>
      ${changes.map(x=>`<tr><td>${esc(x.id)}</td><td style="line-height:2.0">${esc(x.iface)}</td><td>${chgBadge(x.status)}</td>
        <td class="mono" style="line-height:1.95">${esc(x.watchdog_until||'-')}</td><td>${esc(x.operator||'-')}</td><td class="muted mono" style="line-height:1.95">${esc(x.created_at)}</td>
        <td>${x.status==='pending'?`<button class="btn sm" data-act="confirmChange" data-a1="${esc(x.id)}">确认无误</button>`:'<span class="muted">-</span>'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty" style="padding:34px 28px;line-height:2.15">暂无变更记录。可先对某网卡执行「快照」或「改 IP」（管理员）查看效果。</div>'}</div></div>`;
};

window.snapModal = async (name)=>{
  try{ const r = await api('/network/snapshot',{method:'POST',body:{iface:name,reason:'手动快照'}});
    toast('快照已保存 id='+r.snapshot_id,'ok'); go('network');
  }catch(e){ toast('快照失败: '+e.message,'err'); }
};

window.snapFromBtn = (b)=>{ snapModal(b.getAttribute('data-name') || ''); };
window.changeFromBtn = (b)=>{ let f = {}; try{ f = JSON.parse(b.getAttribute('data-iface') || '{}'); }catch(e){ f = {}; } changeModal(f.name || '', f); };
window.changeModal = (name, info)=>{
  const ip = (info.ipv4[0]||{}).ip||'';
  const prefix = (info.ipv4[0]||{}).prefix||24;
  openModal('修改网卡 IP —— '+name, `
    <div class="field"><label>IP 地址</label><input id="f_ip" value="${esc(ip)}"></div>
    <div class="field"><label>前缀长度</label><input id="f_prefix" value="${esc(prefix)}"></div>
    <div class="field"><label>网关</label><input id="f_gw" value="${esc(info.gateway||'')}"></div>
    <div class="field"><label>DNS（可选）</label><input id="f_dns" placeholder="8.8.8.8"></div>
    <div class="field"><label>看门狗秒数（超时未确认自动回滚）</label><input id="f_wd" value="120"></div>
    <div class="muted">⚠ 变更前会自动快照；三级验证失败立即回滚；成功后需在倒计时内点“确认无误”。</div>`,
    `<button class="btn ghost" data-act="closeModal">取消</button>
     <button class="btn danger" data-act="doChange" data-a1="${esc(name)}">执行变更</button>`);

function gWatchBadge(w){
  if(!w) return '';
  if(w.running) return '<span class="badge b-ok" title="WMI 进程创建事件源：1 秒粒度，补上两次轮询之间生灭的短命进程；已捕获 '+esc(w.seen||0)+' 个进程创建">事件源 1s · 已捕 '+(w.seen||0)+'</span>';
  if(w.available && w.available.ok) return '<span class="badge b-gray" title="事件源未启动（引擎停止时会一起停）">事件源未启动</span>';
  return '<span class="badge b-warn" title="找不到 PowerShell，短命进程只能靠 8 秒轮询">事件源不可用</span>';
}

async function guardViewPolicy(pol){

    return '<label style="display:flex;align-items:center;gap:10px;padding:10px 0;line-height:1.9">'
      + '<input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' style="width:auto">'
      + '<span>' + esc(label) + (tip ? '<span class="muted"> · ' + esc(tip) + '</span>' : '') + '</span></label>';
  };
  const field = function(id, label, val, tip){
    return '<div class="field" style="margin-bottom:16px"><label>' + esc(label)
      + '</label><input id="' + id + '" value="' + esc(val) + '" style="max-width:220px">'
      + (tip ? '<div class="muted" style="margin-top:8px;line-height:1.8">' + esc(tip) + '</div>' : '') + '</div>';
  };
  const modes = ['monitor','alert','block'].map(function(m){
    const act = p.mode === m;
    const desc = {monitor:'只采集与记录，不动系统', alert:'额外写告警台、自动开事件单', block:'真正下发防火墙阻断/结束进程'}[m];
    return '<button class="btn ' + (act ? '' : 'ghost') + '" data-act="guardSetMode" data-a1="' + m + '">'
      + (act ? '✓ ' : '') + gModeBadge(m) + ' ' + esc(desc) + '</button>';
  }).join(' ');

  return '<div class="panel"><div class="panel-h"><h3>处置档位</h3><span class="muted">点一下即时生效</span></div>'
    + '<div class="panel-b" style="padding:22px 24px;display:flex;gap:12px;flex-wrap:wrap">' + modes + '</div></div>'
    + '<div class="panel"><div class="panel-h"><h3>引擎参数</h3></div><div class="panel-b" style="padding:22px 24px">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 28px">'
    + field('gPInt','扫描间隔（秒，3–120）', p.interval_sec || 8, '越小越灵敏，主机越忙；慢速采集项自带缓存')
    + field('gPScore','动作阈值（1–200）', p.score_threshold || 60, '事件评分低于该值不下发动作')
    + field('gPRate','每分钟动作上限（1–120）', p.max_actions_per_min || 12, '防止误判时一次性阻断太多')
    + field('gPExp','阻断自动过期（分钟，1–1440）', p.expire_minutes || 30, '到期自动解封，避免永久误封')
    + '</div>'
    + '<div style="margin-top:8px">'
    + sw('gPBlockIp','自动阻断外部 IP', p.auto_block_ip, '只封外网地址，内网与保留段一律拒绝')
    + sw('gPBlockProg','自动阻断程序出站', p.auto_block_program, '比重命名/删文件温和，可回滚')
    + sw('gPKill','自动结束进程', p.auto_kill_process, '最后手段，受关键进程与自保护约束')
    + sw('gPIncident','自动开事件单', p.auto_incident, 'high 及以上')
    + sw('gPNotify','自动推送通知', p.auto_notify, '走通知中心已配渠道')
    + sw('gPAuto','开机自动启动引擎', p.autostart, '随服务启动后立即进入守护')
    + '</div>'
    + '<button class="btn" data-act="guardPolicySave" style="margin-top:18px">保存策略</button>'
    + '<div class="muted" style="margin-top:12px;line-height:1.9">'
    + '当前进程' + (p.admin === false ? '未提权' : '') + '：未提权时阻断会被明确拒绝并留痕，不会半执行。</div>'
    + '</div></div>';
}

window.guardEvRespond = async function(id, action){
  const label = GACT[action] || action;
  if(!confirm('确认下发「' + label + '」？\n\n这会写系统防火墙（结束进程则直接杀进程），并记入审计；成功后可在处置记录里回滚。')) return;
  try{
    const r = await api('/guard/events/' + id + '/respond', {method:'POST', body:{action: action}});
    if(r.ok){
      toast('已下发：' + label + ' → ' + String(r.target), 'ok');
    }else{
      toast(label + ' 未下发：' + (GERR[r.error] || r.error || '未知原因'), 'warn');
    }
    closeModal(); go('guard');
  }catch(e){ toast(e.message, 'err'); }
};

window.guardEvDel = async function(id){
  if(!confirm('确认删除事件 #' + id + '？\n\n只删这条记录，处置留痕（含已下发的防火墙规则）会保留，仍可在「响应与对账」里回滚。删除动作本身会写审计。')) return;
  try{
    const r = await api('/guard/events/' + id, {method:'DELETE'});
    toast('已删除 ' + (r.deleted || 1) + ' 条事件'
      + (r.live_responses ? '（该事件还有 ' + r.live_responses + ' 个生效中的处置，去「响应与对账」可回滚）' : ''), 'ok');
    closeModal(); go('guard');
  }catch(e){ toast(e.message, 'err'); }
};

  const tip = mode === 'all'
    ? '\n\n⚠ 这会清空整个事件列表。处置留痕和审计记录不受影响。'
    : '\n\n处置留痕（含已下发的防火墙规则）会保留。';

  try{

  const x=m[t]||['b-gray',t]; return `<span class="badge ${x[0]}">${x[1]}</span>`; }

// ========== 虚拟滚动 + 游标分页（上万条不卡） ==========
// makeVS(opts): opts={rowH,maxH,cols:[...],head:[...],fetchPage(cursor)->Promise{rows,atEnd},onRender(row)->[htmlCell...]}
// 返回滚动容器元素；_loadMore() 触发下一页；_updateQuery() 清缓存。
window.makeVS = function(o){
  var ROW=o.rowH||88, BUF=6;
  // cols 里写裸数字（188 / 88 / 160）时，grid-template-columns 拿到的是一条
  // 没有单位的非法声明，浏览器会整条丢弃 —— 表现就是表头和每行都竖排成一行一列。
  // 这里统一补 px，页面传 188 或 "188px" 都对。
  var COLS = (o.cols||[]).map(function(v){
    return (typeof v === 'number' || /^\d+(\.\d+)?$/.test(String(v))) ? (v+'px') : v;
  }).join(' ');
  var rows=[], cursor=0, atEnd=false, loading=false;
  var wrap=document.createElement('div');
  wrap.className='vs-wrap';
  wrap.style.cssText='overflow:auto;max-height:'+(o.maxH||'68vh')+';border:1px solid var(--line,#e5eaf1);border-radius:12px;background:#fff;';
  var head=document.createElement('div');
  head.style.cssText='display:grid;grid-template-columns:'+COLS+';gap:0 18px;font-weight:600;font-size:13px;padding:18px 22px;position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#f4f7fb,#eef2f8);color:#475569;border-bottom:1px solid var(--line,#e5eaf1);line-height:1.8;';
  head.innerHTML=o.head.map(function(h){return '<span>'+esc(h)+'</span>';}).join('');
  wrap.appendChild(head);
  var body=document.createElement('div');
  body.className='vs-body';
  body.style.cssText='position:relative;';
  wrap.appendChild(body);
  var foot=document.createElement('div');
  foot.style.cssText='padding:14px 22px;text-align:center;color:#8b95a7;font-size:13px;min-height:44px;border-top:1px solid #f0f3f8;line-height:1.8;';
  wrap.appendChild(foot);
  function render(){
    var st=wrap.scrollTop, vh=wrap.clientHeight;
    var i0=Math.max(0,Math.floor(st/ROW)-BUF);
    var i1=Math.min(rows.length-1,Math.floor((st+vh)/ROW)+BUF);
    var html='';
    for(var i=i0;i<=i1;i++) html+='<div class="vs-row" style="position:absolute;top:'+(i*ROW)+'px;left:0;right:0;height:'+ROW+'px;display:grid;grid-template-columns:'+COLS+';gap:0 18px;align-items:start;padding:16px 22px;border-bottom:1px solid #eef2f7;box-sizing:border-box;font-size:13.5px;line-height:1.9;overflow:hidden;'+(i%2?'background:#fafbfe':'background:#fff')+'">'+o.onRender(rows[i]).join('')+'</div>';
    body.innerHTML=html;
    body.style.height=(rows.length*ROW)+'px';
    foot.textContent=atEnd?(rows.length?(rows.length+' 条（已全部加载）'):'暂无数据'):(rows.length?rows.length+' 条已加载，滚动加载更多':'加载中…');
  }
  function loadMore(){
    if(loading||atEnd) return;
    loading=true;
    foot.textContent='加载中…';
    o.fetchPage(cursor).then(function(r){
      loading=false;
      var nr=r.rows||[];
      rows=rows.concat(nr); cursor+=nr.length; atEnd=!!r.atEnd;
      render();
    }).catch(function(e){ loading=false; foot.textContent='加载失败: '+(e&&e.message?e.message:e); });
  }
  wrap.addEventListener('scroll',function(){
    if(wrap.scrollTop+wrap.clientHeight>=wrap.scrollHeight-80){ loadMore(); }
    else if(rows.length){ render(); }
  });
  if(window.ResizeObserver){ try{ new ResizeObserver(function(){ if(rows.length) render(); }).observe(wrap); }catch(_e){} }
  wrap._loadMore=loadMore;
  wrap._updateQuery=function(){ rows=[]; cursor=0; atEnd=false; body.innerHTML=''; body.style.height='0'; foot.textContent=''; };
  return wrap;
};
window.traceIp = function(ip){
  var tip = document.getElementById('tip'); if(tip) tip.value = ip || '';
  if(window.go) window.go('trace');
  setTimeout(function(){ if(window.doTrace) window.doTrace(); }, 300);
};
// ========== 事件委托（替代全部内联事件属性；配合 CSP nonce，任何无 nonce 的内联脚本/事件属性都会被拦截） ==========
document.addEventListener('click', function(e){
  try{
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if(!b) return;
    var act = b.getAttribute('data-act');
    var fn = window[act];
    if(typeof fn !== 'function'){ if(window.toast) toast('未知操作: '+act,'err'); return; }
    var args = [];
    for(var i=1;;i++){ var v = b.getAttribute('data-a'+i); if(v===null) break; args.push(v); }
    args.push(b);           // 末位传入触发元素，供 go(el)/snapFromBtn(b)/changeFromBtn(b) 使用
    fn.apply(null, args);
  }catch(err){ if(window.toast) toast('操作异常: '+(err&&err.message||err),'err'); }
}, true);
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  var el = e.target && e.target.closest ? e.target.closest('[data-enter]') : null;
  if(!el) return;
  var fn = window[el.getAttribute('data-enter')];
  if(typeof fn==='function') fn();
});
document.addEventListener('input', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-input]') : null;
  if(!el) return;
  var fn = window[el.getAttribute('data-input')];
  if(typeof fn==='function') fn();
});
</script>
